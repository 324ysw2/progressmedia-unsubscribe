<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>수신거부 요청 완료</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#f5f6fb; color:#111827; font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
    main { width:min(680px,100%); padding:54px 36px; border-radius:16px; background:#fff; text-align:center; box-shadow:0 14px 40px rgba(17,24,39,.08); }
    h1 { margin:0; font-size:32px; letter-spacing:-.04em; }
    p { margin:20px 0 0; color:#4b5563; font-size:18px; line-height:1.75; }
  </style>
</head>
<body>
  <main>
    <h1>수신거부 요청이 접수되었습니다.</h1>
    <p>요청 내용을 확인한 뒤 프로그레스미디어 유신욱 자동화메일 발송 대상에서 제외하겠습니다.<br>감사합니다.</p>
  </main>
</body>
</html>
